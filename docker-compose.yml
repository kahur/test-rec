
services:
  php-fpm:
    build:
      context: .
      dockerfile: .docker/php/fpm/Dockerfile
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./:/code
    networks:
      - recruit-io

  php-cli:
    build:
      context: .
      dockerfile: .docker/php/cli/Dockerfile
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./:/code
    networks:
      - recruit-io

  nginx:
    image: nginx:latest
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/code/public
    ports:
      - "80:80"
    networks:
      - recruit-io

  redis:
    image: redis:latest

networks:
  recruit-io:
    driver: bridge

